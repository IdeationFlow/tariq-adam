<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="طريق آدم">
<meta name="theme-color" content="#1b1f4a">
<meta name="description" content="لعبة سيارة: نجوم وأقماع وإشارات، بالعربي والإنجليزي.">
<title>طريق آدم</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;700;800&family=Tajawal:wght@500;700;800&display=swap">
<style>
/* Layout: full-bleed desert-dusk road drawn on canvas; HUD strip on top, thumb controls in the bottom corners, chunky glass cards for menus. One deliberate dusk look in every theme. */
:root{
  --night:#1b1f4a; --plum:#3a2a5c; --dusk:#f3a679; --sun:#ffc94d; --ember:#ff8a3d; --ember-deep:#c4561f;
  --ink:#fff7ec; --ink-soft:#f3d9c4; --ink-dark:#2a1730;
  --glass:rgba(27,24,60,.78); --glass-edge:rgba(255,214,170,.30);
  --go:#3ddc84; --amber:#ffb627; --stop:#ff4136; --stop-deep:#a3202a; --star:#ffd23f; --magic:#c9a6ff;
  --sky-btn:#3d8bff; --sky-btn-deep:#1f4fb8;
  --font-display:"Baloo Bhaijaan 2","Tajawal",system-ui,-apple-system,sans-serif;
  --font-body:"Tajawal",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html{height:100%;background:var(--night)}
body{position:fixed;inset:0;overscroll-behavior:none;margin:0;font-size:14px;background:var(--night);color:var(--ink);font-family:var(--font-body);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#app{position:absolute;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);overflow:hidden}
#road{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:3px}

/* HUD */
.hud{position:absolute;top:0;left:0;right:0;z-index:10;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px 10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0;pointer-events:none}
.hud>*{pointer-events:auto}
.chip{justify-self:start;display:flex;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--glass-edge);border-radius:999px;padding:7px 14px 5px;font:800 1.05rem/1 var(--font-display);white-space:nowrap;min-width:0;overflow:hidden}
.chip span:last-child{overflow:hidden;text-overflow:ellipsis}
.dot{width:14px;height:14px;flex:none;border-radius:50%;background:var(--sky-btn);box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.score{display:flex;align-items:center;gap:6px;background:var(--glass);border:1px solid var(--glass-edge);border-radius:999px;padding:6px 16px 3px;
  font:800 1.6rem/1 var(--font-display);color:var(--star);font-variant-numeric:tabular-nums}
.score svg{width:26px;height:26px;margin-top:-3px}
.score.pop{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
.hud-actions{justify-self:end;display:flex;gap:8px}
.icon-btn{width:44px;height:44px;flex:none;border-radius:15px;background:var(--glass);border:1px solid var(--glass-edge);color:var(--ink);display:grid;place-items:center;padding:0;font:800 1.05rem/1 var(--font-display)}
.icon-btn svg{width:22px;height:22px}
.progress{grid-column:1/-1;height:9px;border-radius:99px;background:rgba(255,247,236,.18);position:relative}
.bar{height:100%;width:0;background:linear-gradient(90deg,var(--ember),var(--sun));border-radius:inherit}
.progress::after{content:"";position:absolute;inset-inline-end:0;top:0;bottom:0;width:12px;
  background:repeating-conic-gradient(var(--ink) 0 25%,var(--ink-dark) 0 50%) 0 0/6px 6px}
.gdot{position:absolute;top:50%;width:14px;height:14px;margin-inline-start:-7px;margin-top:-7px;border-radius:50%;background:var(--magic);
  box-shadow:0 0 0 2px var(--ink-dark),0 0 10px var(--magic)}

/* traffic signal banner */
.signal{position:absolute;top:96px;left:50%;transform:translateX(-50%);z-index:11;display:flex;align-items:center;gap:7px;direction:ltr;
  background:#15131f;border:2px solid #34314a;border-radius:999px;padding:6px 16px 6px 10px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.lamp{width:22px;height:22px;border-radius:50%;background:#35303f}
.signal[data-state="red"] .lamp.r{background:var(--stop);box-shadow:0 0 16px var(--stop)}
.signal[data-state="yellow"] .lamp.y{background:var(--amber);box-shadow:0 0 16px var(--amber)}
.signal b{font:800 1.35rem/1 var(--font-display);margin-left:6px;padding-top:3px}

.toast{position:absolute;top:30%;left:50%;z-index:30;transform:translate(-50%,-10px);opacity:0;transition:opacity .2s,transform .2s;
  font:800 clamp(1.3rem,5vw,2.1rem)/1.25 var(--font-display);color:var(--ink);text-shadow:0 2px 0 rgba(0,0,0,.35);
  padding:10px 20px 6px;border-radius:20px;background:rgba(27,24,60,.62);width:max-content;max-width:calc(100% - 32px);text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.good{color:var(--star)}
.toast.warn{color:#ffd0b5}
.toast.magic{color:var(--magic)}

.count{position:absolute;inset:0;z-index:12;display:grid;place-items:center;pointer-events:none;
  font:800 clamp(5rem,26vw,10rem)/1 var(--font-display);color:var(--sun);text-shadow:0 7px 0 rgba(0,0,0,.28)}
.count.tick{animation:tick .55s ease-out}
@keyframes tick{0%{transform:scale(1.5);opacity:0}30%{opacity:1}100%{transform:scale(1);opacity:1}}

/* thumb controls: physical left/right, so this strip stays left-to-right in both languages */
.controls{position:absolute;left:0;right:0;bottom:0;z-index:10;direction:ltr;display:flex;justify-content:space-between;align-items:flex-end;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 16px;pointer-events:none}
.steer{display:flex;gap:10px}
.pad{pointer-events:auto;touch-action:none;width:clamp(62px,15vw,94px);height:clamp(62px,15vw,94px);border-radius:26px;padding:0;
  background:rgba(255,247,236,.16);border:2px solid rgba(255,247,236,.42);color:var(--ink);display:grid;place-items:center;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:background .08s,transform .08s}
.pad svg{width:46%;height:46%}
.pad.on{background:rgba(255,247,236,.42);transform:scale(.95)}
.brake{width:clamp(76px,19vw,112px);height:clamp(76px,19vw,112px);border:0;border-radius:0;background:var(--stop);color:#fff;
  clip-path:polygon(29% 0,71% 0,100% 29%,100% 71%,71% 100%,29% 100%,0 71%,0 29%);font:800 clamp(1.25rem,4.6vw,1.8rem)/1 var(--font-display);padding-top:4px}
.brake.on{background:var(--stop-deep)}
.brake.urgent{animation:urge .6s ease-in-out infinite}
@keyframes urge{50%{transform:scale(1.1)}}
.wheel{pointer-events:auto;touch-action:none;width:clamp(128px,30vw,196px);aspect-ratio:1;max-width:100%;border-radius:50%;
  background:radial-gradient(circle,rgba(255,247,236,.1) 55%,rgba(255,247,236,.04) 56%);display:grid;place-items:center}
.wheel svg{width:100%;height:100%;transition:transform .28s ease-out;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.wheel.on svg{transition:transform .04s linear}

/* cards */
.overlay{position:absolute;inset:0;z-index:20;display:grid;place-items:center;overflow:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;
  background:radial-gradient(120% 90% at 50% 20%,rgba(27,31,74,.2),rgba(14,10,32,.74))}
.card{width:100%;max-width:470px;display:grid;gap:13px;text-align:center;background:var(--glass);border:1px solid var(--glass-edge);border-radius:28px;
  padding:16px 20px 20px;box-shadow:0 22px 60px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.12);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.topline{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lang{border:1px solid var(--glass-edge);background:rgba(255,247,236,.1);color:var(--ink);border-radius:999px;padding:9px 16px 6px;font:800 1rem/1 var(--font-display)}
.title{margin:0;font:800 clamp(2.5rem,11vw,3.5rem)/1.05 var(--font-display);color:var(--sun);text-shadow:0 4px 0 rgba(0,0,0,.25);text-wrap:balance}
.title.sm{font-size:clamp(1.8rem,8vw,2.2rem)}
.lane{height:6px;width:62%;justify-self:center;border-radius:3px;background:repeating-linear-gradient(90deg,var(--ink) 0 26px,transparent 26px 44px);opacity:.75}
.lead{margin:0;font:700 1.08rem/1.6 var(--font-body);color:var(--ink-soft);text-wrap:balance}
.news{margin:0;display:flex;gap:10px;align-items:flex-start;text-align:start;background:rgba(201,166,255,.14);border:1px solid rgba(201,166,255,.45);border-radius:16px;padding:10px 12px 8px;
  font:700 .95rem/1.5 var(--font-body);color:var(--ink)}
.news b{flex:none;background:var(--magic);color:var(--ink-dark);border-radius:999px;padding:4px 10px 1px;font:800 .9rem/1.3 var(--font-display)}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rule{display:grid;justify-items:center;gap:6px;background:rgba(255,247,236,.07);border-radius:16px;padding:10px 6px 8px;font:700 .9rem/1.3 var(--font-body);color:var(--ink-soft)}
.rule svg{width:34px;height:34px}
.label{font:700 .95rem/1 var(--font-body);color:var(--ink-soft)}
.whohead{display:flex;justify-content:space-between;align-items:center}
.whohead .label{font:800 1.2rem/1 var(--font-display);color:var(--ink)}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card.wide{max-width:600px}
.player{display:flex;align-items:center;gap:8px;min-width:0;border:2px solid rgba(255,247,236,.22);background:rgba(255,247,236,.08);color:var(--ink);
  border-radius:18px;padding:12px 12px 9px;font:800 1.12rem/1.1 var(--font-display);text-align:start;transition:transform .08s,background .1s}
.player:active{transform:scale(.96);background:rgba(255,247,236,.18)}
.player .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.player .bs{flex:none;font:700 .85rem/1 var(--font-body);color:var(--star);font-variant-numeric:tabular-nums}
.player.add{justify-content:center;border-style:dashed;color:var(--ink-soft)}
.players.managing .player:not(.add){border-color:var(--sun);background:rgba(255,201,77,.12)}
.players.managing .player:not(.add) .bs::before{content:"✎ ";color:var(--sun)}
.swatches{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid rgba(255,255,255,.22);padding:0;transition:transform .12s}
.sw[aria-pressed="true"]{border-color:var(--ink);transform:scale(1.14)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{border:0;border-radius:999px;padding:.95rem .8rem .75rem;font:800 1.25rem/1 var(--font-display);color:var(--ink-dark);
  background:linear-gradient(180deg,var(--sun),var(--ember));box-shadow:0 6px 0 var(--ember-deep),0 12px 20px rgba(0,0,0,.3);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ember-deep)}
.btn.blue{color:#fff;background:linear-gradient(180deg,#63a6ff,var(--sky-btn));box-shadow:0 6px 0 var(--sky-btn-deep),0 12px 20px rgba(0,0,0,.3)}
.btn.blue:active{box-shadow:0 2px 0 var(--sky-btn-deep)}
.link{background:none;border:0;padding:6px;font:700 1rem/1.2 var(--font-body);color:var(--ink-soft);text-decoration:underline;text-underline-offset:5px;justify-self:center}
.link.danger{color:#ffb3a8}
.big{display:flex;justify-content:center;align-items:center;gap:10px;font:800 clamp(3.4rem,14vw,4.6rem)/1 var(--font-display);color:var(--star);font-variant-numeric:tabular-nums}
.big svg{width:.85em;height:.85em;margin-top:-.12em}
.sub{margin:0;font:700 1.06rem/1.5 var(--font-body);color:var(--ink-soft)}
.race{margin:0;font:800 1.15rem/1.45 var(--font-display);color:var(--magic);text-wrap:balance}
.race.won{color:var(--star)}
.badge{justify-self:center;background:var(--go);color:#0f2a1c;border-radius:999px;padding:6px 14px 3px;font:800 1rem/1 var(--font-display)}
.note{display:grid;gap:6px;background:rgba(255,247,236,.1);border:1px dashed rgba(255,214,170,.5);border-radius:18px;padding:14px 14px 12px}
.note h3{margin:0;font:800 1rem/1 var(--font-display);color:var(--sun)}
.note p{margin:0;font:800 1.28rem/1.55 var(--font-display);color:var(--ink);text-wrap:balance}
.champs{display:grid;gap:8px;background:rgba(255,247,236,.06);border-radius:18px;padding:12px 12px 10px}
.champs h3{margin:0;font:800 1.05rem/1 var(--font-display);color:var(--sun)}
.champs ol{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.champs li{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:8px;padding:6px 10px 4px;border-radius:12px;font:700 1rem/1.2 var(--font-body);text-align:start}
.champs li.me{background:rgba(255,201,77,.18)}
.champs .rk{font:800 1rem/1 var(--font-display);color:var(--ink-soft);text-align:center}
.champs .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.champs .st{color:var(--star);font-variant-numeric:tabular-nums;font-weight:800}
.champs svg{width:22px;height:22px;display:block;margin:0 auto}
.set{display:grid;gap:8px;text-align:start}
.set>span{font:800 1.05rem/1 var(--font-display);color:var(--ink)}
.seg{display:flex;gap:6px;background:rgba(10,8,28,.45);border-radius:16px;padding:5px}
.seg button{flex:1;border:0;border-radius:12px;background:transparent;color:var(--ink-soft);padding:11px 6px 8px;font:800 1rem/1 var(--font-display)}
.seg button[aria-pressed="true"]{background:var(--sun);color:var(--ink-dark)}
.seg button:disabled{opacity:.4}
.hint{margin:0;font:700 .88rem/1.45 var(--font-body);color:var(--ink-soft)}
input[type="text"],textarea{width:100%;box-sizing:border-box;border-radius:16px;border:1px solid var(--glass-edge);background:rgba(10,8,28,.55);color:var(--ink);
  font:700 1.2rem/1.5 var(--font-body);padding:12px 14px;-webkit-user-select:text;user-select:text}
input[type="text"]:disabled{opacity:.6}
textarea{min-height:110px;resize:vertical}
@media (max-width:380px){.rules{grid-template-columns:1fr}.rule{grid-auto-flow:column;justify-content:start;gap:10px}}
@media (prefers-reduced-motion:reduce){.score.pop,.count.tick,.brake.urgent{animation:none}.brake.urgent{box-shadow:0 0 0 4px var(--sun)}.toast{transition:none}}
</style>
</head>
<body>
<div id="app" dir="rtl">
  <canvas id="road" data-ta="canvasAria"></canvas>

  <header class="hud" id="hud" hidden>
    <div class="chip"><span class="dot" id="driverDot"></span><span id="driverName"></span></div>
    <div class="score" id="score" data-ta="stars">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#ffd23f" stroke="#f08a1c" stroke-width="1.5" stroke-linejoin="round" d="M12 2.6l2.9 6 6.5.8-4.8 4.5 1.2 6.5L12 17.2l-5.8 3.2 1.2-6.5-4.8-4.5 6.5-.8z"/></svg>
      <span id="starCount">٠</span>
    </div>
    <div class="hud-actions">
      <button class="icon-btn" id="langHud" data-ta="langAria"></button>
      <button class="icon-btn" id="muteBtn" data-ta="sound" aria-pressed="false">
        <svg id="soundOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
        <svg id="soundOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
      </button>
      <button class="icon-btn" id="homeBtn" data-ta="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
      </button>
    </div>
    <div class="progress" aria-hidden="true"><div class="bar" id="bar"></div><span class="gdot" id="gdot" hidden></span></div>
  </header>

  <div class="signal" id="signal" hidden><span class="lamp r"></span><span class="lamp y"></span><span class="lamp g"></span><b id="signalText"></b></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="count" id="count" hidden></div>

  <div class="controls" id="controls" hidden>
    <div class="steer" id="steerArrows">
      <button class="pad" id="leftBtn" data-ta="left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4l-8 8 8 8"/></svg></button>
      <button class="pad" id="rightBtn" data-ta="right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4l8 8-8 8"/></svg></button>
    </div>
    <div class="wheel" id="wheel" data-ta="wheelAria" role="slider" aria-valuemin="-1" aria-valuemax="1" aria-valuenow="0" hidden>
      <svg id="wheelSvg" viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="42" fill="none" stroke="#2a2833" stroke-width="11"/>
        <circle cx="50" cy="50" r="42" fill="none" stroke="#4a4757" stroke-width="5"/>
        <path d="M50 50 L12 56 M50 50 L88 56 M50 50 L50 92" stroke="#2a2833" stroke-width="9" stroke-linecap="round"/>
        <circle cx="50" cy="52" r="13" fill="#2a2833"/><circle cx="50" cy="52" r="8" fill="#ff8a3d"/>
        <rect x="45" y="3" width="10" height="11" rx="3" fill="#ffc94d"/>
      </svg>
    </div>
    <button class="pad brake" id="brakeBtn" data-t="brake" data-ta="brakeAria"></button>
  </div>

  <section class="overlay" id="menu">
    <div class="card wide">
      <div class="topline">
        <button class="lang" id="langMenu" data-t="langBtn" data-ta="langAria"></button>
        <button class="icon-btn" id="gearBtn" data-ta="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.4"/><circle cx="10" cy="17" r="2.4"/></svg>
        </button>
      </div>
      <h1 class="title" data-t="title"></h1>
      <div class="lane" aria-hidden="true"></div>
      <p class="lead" data-t="lead"></p>
      <div class="rules">
        <div class="rule"><svg viewBox="0 0 24 24" fill="none" stroke="#fff7ec" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5"/></svg><span data-t="r1"></span></div>
        <div class="rule"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#ffd23f" stroke="#f08a1c" stroke-width="1.5" stroke-linejoin="round" d="M12 2.6l2.9 6 6.5.8-4.8 4.5 1.2 6.5L12 17.2l-5.8 3.2 1.2-6.5-4.8-4.5 6.5-.8z"/></svg><span data-t="r2"></span></div>
        <div class="rule"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="1.5" width="10" height="21" rx="3.5" fill="#15131f" stroke="#34314a"/><circle cx="12" cy="6.5" r="2.6" fill="#ff4136"/><circle cx="12" cy="12" r="2.6" fill="#4a3a26"/><circle cx="12" cy="17.5" r="2.6" fill="#1f3a2b"/></svg><span data-t="r3"></span></div>
      </div>
      <div class="whohead"><span class="label" data-t="who"></span><button class="link" id="manageBtn"></button></div>
      <div class="players" id="players"></div>
      <p class="news"><b data-t="newTag"></b><span data-t="newText"></span></p>
      <button class="link" id="editMsg" data-t="editMsg"></button>
    </div>
  </section>

/* ---------- saved per-device settings: names, records and laps never leave this device ---------- */
const KEY = 'tariq-adam-v1';
const PALETTE = ['#3d8bff','#ff4d4f','#2ec27e','#ffc233','#a66bff','#ff7ab6','#20c5c5','#ff8a3d'];
function loadStore(){
  const base = {v:3, lang:'ar', muted:false, magic:true, magicRate:1, control:'arrows', msg:{ar:'',en:''},
    players:[{id:'adam', name:'', color:PALETTE[0], best:0}, {id:'baba', name:'', color:PALETTE[1], best:0}], laps:{}, recent:[]};
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || '{}');
    if (s.v === 3){
      const out = Object.assign({}, base, s);
      out.msg = Object.assign({}, base.msg, s.msg || {});
      if (!Array.isArray(out.players) || !out.players.length) out.players = base.players;
      out.laps = s.laps || {}; out.recent = Array.isArray(s.recent) ? s.recent : [];
      if (out.lang !== 'en') out.lang = 'ar';
      return out;
    }
    /* carry over records from the earlier two-driver version */
    const out = JSON.parse(JSON.stringify(base));
    if (s.lang === 'en') out.lang = 'en';
    out.muted = !!s.muted;
    out.msg = typeof s.msg === 'string' ? {ar:s.msg, en:''} : Object.assign({}, base.msg, s.msg || {});
    if (s.best){ out.players[0].best = s.best.adam || 0; out.players[1].best = s.best.baba || 0; }
    if (s.color) out.players[0].color = s.color;
    if (s.ghost){ for (const id of ['baba','adam']) if (s.ghost[id] && s.ghost[id].p){ out.laps[id] = s.ghost[id]; out.recent.push(id); } }
    return out;
  } catch(e){ return base; }
}
const store = loadStore();
function saveStore(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e){} }
const T = () => I18N[store.lang];
const N = n => store.lang === 'ar' ? Number(n).toLocaleString('ar-EG') : String(n);
const N1 = n => Number(n).toLocaleString(store.lang === 'ar' ? 'ar-EG' : 'en-US', {minimumFractionDigits:1, maximumFractionDigits:1});
const getP = id => store.players.find(p => p.id === id) || store.players[0];
const dispName = id => { const p = store.players.find(q => q.id === id); return (p && p.name) || T().names[id] || '؟'; };
const plateName = id => { const p = store.players.find(q => q.id === id); return (p && p.name) || T().plate[id] || '؟'; };

/* ---------- world constants ---------- */
const SEG = 200, ROAD_W = 2000, RUMBLE = 3, LANES = 3, DRAW_DIST = 210;
const CAM_DEPTH = 1/Math.tan(50*Math.PI/180);
const MAX_SPEED = SEG*60*0.72;
const ACCEL = MAX_SPEED/4.5, BRAKE = -MAX_SPEED*1.25;
const OFF_ROAD_DECEL = -MAX_SPEED/1.8, OFF_ROAD_LIMIT = MAX_SPEED/2, CENTRIFUGAL = 0.15;
const CAR_WORLD_W = 0.36*ROAD_W;
const COL = {
  skyTop:'#1b1f4a', skyMid:'#4f3577', skyLow:'#c8676d', horizon:'#f3a679', fog:'#eea27b',
  far:'#86507f', mid:'#623a69',
  sandL:'#e6b27a', sandD:'#d9a26b', roadL:'#4b4d5c', roadD:'#45475a',
  rumbleL:'#fff3e3', rumbleD:'#e2483f', lane:'#fff3e3', stop:'#fbf3e8', chkA:'#fff7ec', chkB:'#2a1730'
};
/* road colours pre-blended toward the haze, so distant bands fade without overlay seams */
const FOG_STEPS = 48, FC = {};
(function(){ const rgb = h => { const n = parseInt(h.slice(1),16); return [n>>16,(n>>8)&255,n&255]; }; const f = rgb(COL.fog);
  for (const k of ['sandL','sandD','roadL','roadD','rumbleL','rumbleD','lane','stop','chkA','chkB']){ const c = rgb(COL[k]); FC[k] = [];
    for (let i=0;i<=FOG_STEPS;i++){ const t = i/FOG_STEPS; FC[k].push('rgb(' + c.map((v,j) => Math.round(f[j] + (v-f[j])*t)).join(',') + ')'); } } })();
const fc = (k, fog) => FC[k][Math.round(Math.max(0, Math.min(1, fog))*FOG_STEPS)];

let W=1, H=1, DPR=1, horizonY=0, playerLineY=0, K=1, HALF_W=1, CAM_H=1000, PLAYER_Z=839;
function layout(){
  const r = canvas.getBoundingClientRect();
  W = Math.max(1, r.width); H = Math.max(1, r.height);
  DPR = Math.max(1, Math.min(window.devicePixelRatio || 1, 2, Math.sqrt(2.6e6/(W*H))));
  canvas.width = Math.round(W*DPR); canvas.height = Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const portrait = H > W*1.05;
  horizonY = H*(portrait ? 0.42 : 0.44);
  playerLineY = portrait ? H - Math.min(118, H*0.14) : H - Math.max(14, H*0.035);
  K = playerLineY - horizonY;
  HALF_W = portrait ? W*0.92 : Math.min(W*0.62, K*1.9);
  CAM_H = Math.min(3200, Math.max(700, ROAD_W*K/HALF_W));
  PLAYER_Z = CAM_H*CAM_DEPTH;
}

/* ---------- seeded randomness so the road is the same every round ---------- */
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- track ---------- */
let segments = [], lights = [], finishIdx = 0, skyDots = [];
const ease = { in:(a,b,p)=>a+(b-a)*p*p, inOut:(a,b,p)=>a+(b-a)*((-Math.cos(p*Math.PI)/2)+0.5) };
function lastY(){ return segments.length ? segments[segments.length-1].p2.world.y : 0; }
function addSegment(curve, y){
  const n = segments.length;
  segments.push({index:n, curve, sprites:[], clip:0, fog:1, stop:false, finish:false,
    p1:{world:{y:lastY(), z:n*SEG}, camera:{}, screen:{}},
    p2:{world:{y:y, z:(n+1)*SEG}, camera:{}, screen:{}}});
}
function addRoad(enter, hold, leave, curve, hill){
  const start = segments.length, sy = lastY(), ey = sy + hill*SEG, total = enter+hold+leave;
  for (let n=0;n<enter;n++) addSegment(ease.in(0,curve,n/enter), ease.inOut(sy,ey,n/total));
  for (let n=0;n<hold;n++)  addSegment(curve, ease.inOut(sy,ey,(enter+n)/total));
  for (let n=0;n<leave;n++) addSegment(ease.inOut(curve,0,n/leave), ease.inOut(sy,ey,(enter+hold+n)/total));
  return start;
}
function addSprite(i, type, offset, extra){
  const seg = segments[i]; if (!seg) return;
  const w = {palm:1150, bush:620, star:300, cone:270, light:270, finish:0}[type];
  seg.sprites.push(Object.assign({type, offset, w, taken:false}, extra||{}));
}
function buildTrack(){
  segments = []; lights = [];
  addRoad(20,80,20,0,0);
  addRoad(40,60,40,2,8);
  addRoad(30,80,30,0,-8);
  addRoad(40,60,40,-2.5,0);
  const s4 = addRoad(30,140,30,0,12);
  addRoad(40,70,40,3,-12);
  addRoad(30,50,30,0,0);
  addRoad(40,60,40,-3,10);
  const s8 = addRoad(30,150,30,0,-10);
  addRoad(30,50,30,2.5,0);
  addRoad(30,50,30,-2.5,8);
  const s11 = addRoad(30,150,30,0,-8);
  addRoad(40,60,40,2,0);
  const s13 = addRoad(30,90,30,0,0);
  addRoad(0,340,0,0,0);
  [s4+140, s8+150, s11+150].forEach(idx => {
    const L = {index:idx, state:'green', done:false, t:0, stopT:0, result:null};
    lights.push(L); segments[idx].stop = true;
    addSprite(idx, 'light', 1.32, {light:L}); addSprite(idx, 'light', -1.32, {light:L});
  });
  finishIdx = s13 + 90;
  segments[finishIdx].finish = segments[finishIdx+1].finish = true;
  addSprite(finishIdx, 'finish', 0);
  const r = rng(20261125);
  const near = (i, before, after) => lights.some(L => i > L.index-before && i < L.index+after);
  for (let i=30; i<segments.length-10; i += 9 + Math.floor(r()*11)){
    const side = r() < 0.5 ? -1 : 1;
    if (!near(i, 6, 6)) addSprite(i, 'palm', side*(1.5 + r()*1.25), {flip: r()<0.5?-1:1});
    if (r() < 0.55) addSprite(i+4, 'bush', -side*(1.35 + r()*0.9));
  }
  const LANE_X = [-0.62, 0, 0.62];
  let i = 150;
  while (i < finishIdx - 60){
    if (near(i, 150, 30) || near(i+60, 150, 30)) { i += 20; continue; }
    const a = Math.floor(r()*3), cnt = 3 + Math.floor(r()*3);
    const snake = r() < 0.3, b = snake ? (a===1 ? (r()<0.5?0:2) : 1) : a;
    for (let k=0;k<cnt;k++) addSprite(i + k*6, 'star', LANE_X[a] + (LANE_X[b]-LANE_X[a])*(cnt>1 ? k/(cnt-1) : 0));
    if (i > 230 && r() < 0.6){
      const others = [0,1,2].filter(x => x !== b);
      addSprite(i + cnt*6 + 16, 'cone', LANE_X[others[Math.floor(r()*others.length)]]);
    }
    i += cnt*6 + 40 + Math.floor(r()*30);
  }
  skyDots = Array.from({length:42}, () => ({x:r(), y:r(), s:0.8+r()*1.6, p:r()*6.28}));
}
function resetRound(){
  for (const s of segments) for (const sp of s.sprites) sp.taken = false;
  for (const L of lights){ L.state='green'; L.done=false; L.t=0; L.stopT=0; L.result=null; }
}
const segIdx = z => Math.max(0, Math.min(segments.length-1, Math.floor(z/SEG)));
const segAt = z => segments[segIdx(z)];
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

/* ---------- sound ---------- */
let AC = null, eng = null, engTick = 0;
function audio(){
  if (!AC){ try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume().catch(()=>{});
  return AC;
}
function tone(freq, dur, type, vol, when, slide){
  if (store.muted) return; const a = audio(); if (!a) return;
  const t = a.currentTime + (when||0), o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t+dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol||0.12, t+0.012); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+0.03);
}
const sfx = {
  star(){ tone(988,0.11,'triangle',0.11); tone(1480,0.14,'triangle',0.09,0.055); },
  cone(){ tone(170,0.22,'square',0.07,0,70); },
  good(){ [523,659,784,1047].forEach((f,k)=>tone(f,0.16,'triangle',0.11,k*0.09)); },
  whistle(){ tone(2300,0.12,'square',0.045); tone(2750,0.12,'square',0.045,0.13); tone(2300,0.22,'square',0.045,0.26); },
  beep(hi){ tone(hi?880:520, hi?0.35:0.16, 'square', 0.06); },
  win(){ [523,659,784,659,784,1047].forEach((f,k)=>tone(f,0.2,'triangle',0.11,k*0.12)); },
  magic(){ [1319,1568,1976,2637].forEach((f,k)=>tone(f,0.12,'sine',0.07,k*0.05)); },
  pop(){ tone(320,0.3,'triangle',0.06,0,80); tone(1900,0.06,'square',0.018,0.12); tone(2400,0.05,'square',0.014,0.2); }
};
function engineStart(){
  const a = audio(); if (!a || eng) return;
  const o = a.createOscillator(), f = a.createBiquadFilter(), g = a.createGain();
  o.type = 'sawtooth'; o.frequency.value = 50; f.type = 'lowpass'; f.frequency.value = 360; g.gain.value = 0;
  o.connect(f); f.connect(g); g.connect(a.destination); o.start(); eng = {o, g};
}
function engineUpdate(sp, dt){
  if (!eng || !AC) return; engTick += dt; if (engTick < 0.08) return; engTick = 0;
  const t = AC.currentTime;
  eng.o.frequency.setTargetAtTime(48 + 74*sp, t, 0.08);
  eng.g.gain.setTargetAtTime(store.muted ? 0 : 0.025 + 0.03*sp, t, 0.1);
}
function engineStop(){
  if (!eng || !AC) return;
  try { eng.g.gain.setTargetAtTime(0, AC.currentTime, 0.05); eng.o.stop(AC.currentTime + 0.4); } catch(e){}
  eng = null;

/* ---------- fireworks ---------- */
const FW_COLORS = ['#ffd23f','#ff7ab6','#7ad7ff','#9dff8a','#ffb36b','#c9a6ff'];
function burst(){
  const cx = W*(0.12 + 0.76*Math.random()), cy = H*(0.08 + 0.26*Math.random()), col = FW_COLORS[Math.floor(Math.random()*FW_COLORS.length)];
  const n = 48, base = Math.min(W, H)*0.42;

}
function updateFireworks(dt){

/* ---------- render ---------- */

/* ---------- update ---------- */

  paused = document.hidden; keyL = keyR = brake = false; wheelVal = 0; paintWheel();
  if (AC){ if (document.hidden) AC.suspend().catch(()=>{}); else AC.resume().catch(()=>{}); }
});
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 250));

/* ---------- boot ---------- */
buildTrack(); layout(); paintMute(); applyControl(); applyLang(); goMenu();
let prev = performance.now();
function frame(ts){
  let dt = (ts - prev)/1000; prev = ts;
  if (dt > 0.05) dt = 0.05; if (dt < 0) dt = 0;
  if (!paused){ update(dt); render(); hud(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
